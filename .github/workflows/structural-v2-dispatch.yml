name: Structural v2 validation probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: background-prepare
        run: echo preparing
        background: true
      - id: background-lint
        run: echo linting
        background: true
      - wait: background-prepare
      - cancel: background-lint
      - wait-all:
